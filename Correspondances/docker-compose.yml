services:
  postgres:
    image: postgres:16
    container_name: correspondances-db
    environment:
      POSTGRES_DB: correspondances
      POSTGRES_USER: correspondances
      POSTGRES_PASSWORD: correspondances
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/db

volumes:
  pgdata:
