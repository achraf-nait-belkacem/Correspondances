spring:
  application:
    name: correspondances
  datasource:
    url: jdbc:postgresql://localhost:5432/correspondances
    username: correspondances
    password: correspondances
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  swagger-ui:
    path: /swagger-ui.html
